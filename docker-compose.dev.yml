# docker-compose.dev.yml
#
# Runs ONLY Postgres + Redis in containers, so you don't have to install
# them natively on Windows. Your FastAPI app still runs normally via
# `uvicorn` on your machine and connects to these. Full app containerization
# (running the API itself in Docker too) comes in Part 6.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d      # start in background
#   docker compose -f docker-compose.dev.yml down        # stop
#   docker compose -f docker-compose.dev.yml down -v     # stop AND wipe data

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: credit_risk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
