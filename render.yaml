# render.yaml
#
# Render Blueprint - defines the whole backend stack (api, worker, postgres,
# redis) so it deploys together with one setup step, similar in spirit to
# docker-compose.yml but in Render's own format.
#
# To use: push this to your repo, then in the Render dashboard choose
# "New +" -> "Blueprint" -> connect this repo. Render reads this file and
# provisions everything automatically.

services:
  # ---------------------------------------------------------------
  # API - the FastAPI backend, publicly accessible.
  #
  # RUN_WORKER_IN_PROCESS=true is set because Render's free tier does
  # not support a standalone "background worker" service type (paid-plan
  # only). This runs the batch-job worker as a thread inside this same
  # service instead. See api/main.py for the full explanation - this is
  # a free-tier trade-off, not the "real" architecture (which is what
  # docker-compose.yml runs locally: api and worker as separate processes).
  # ---------------------------------------------------------------
  - type: web
    name: credit-risk-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: credit-risk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: credit-risk-redis
          property: connectionString
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
    healthCheckPath: /health

  # ---------------------------------------------------------------
  # Redis - managed by Render
  # ---------------------------------------------------------------
  - type: redis
    name: credit-risk-redis
    plan: free
    ipAllowList: []  # only accessible from other services in this project

databases:
  # ---------------------------------------------------------------
  # Postgres - managed by Render
  # ---------------------------------------------------------------
  - name: credit-risk-db
    plan: free
